name: CI

# Gates the auto-merge-to-main workflow (.github/workflows/auto-merge-to-main.yml),
# which only merges a branch once its exact tip SHA has a successful run of the
# workflow literally named "CI" (this one). Must trigger on every branch (no
# `branches:` filter on push) so a run always exists for the auto-merge gate to find.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Skip heavy browser-binary postinstalls; not needed for lint/unit tests/build.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Deterministic application checks (scripts/test-runner.js), covering
      # extractors, dedup, pricing, anti-bot detection, settings encryption,
      # LLM routing, canvas geometry, plus the dual-mode PDF self-suite.
      # The application checks stub Electron/electron-store and the PDF suite is
      # in-memory, so neither requires a browser binary or network access.
      - name: Test
        run: npm test

      # Compile smoke test: builds the Vite client + electron main/preload bundles.
      # (Full electron-builder packaging is intentionally skipped — it needs
      # platform codesigning/DMG tooling unrelated to code correctness.)
      - name: Build (compile smoke test)
        run: npm run build:compile
