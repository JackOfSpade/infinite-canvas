<!doctype html>
<!-- @dsCard group="Colors" name="Color · Ground & Ink" subtitle="Warm off-white ground + four ink levels + hairline rule" viewport="700x280" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; }
  .swatch .chip { height: 60px; }
</style>
</head><body>
<div class="grid">
  <div class="swatch">
    <div class="chip" style="background:var(--bg);"></div>
    <div class="lbl"><span class="name">--bg · ground</span><span class="hex" data-token="--bg"></span><span class="hex" style="color:var(--ink-3)">warm off-white, never #FFF</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:var(--ink-1);"></div>
    <div class="lbl"><span class="name">--ink-1 · primary</span><span class="hex" data-token="--ink-1"></span><span class="hex" style="color:var(--ink-3)">body, role title, name</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:var(--ink-2);"></div>
    <div class="lbl"><span class="name">--ink-2 · secondary</span><span class="hex" data-token="--ink-2"></span><span class="hex" style="color:var(--ink-3)">dates, locations, summary</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:var(--ink-3);"></div>
    <div class="lbl"><span class="name">--ink-3 · tertiary</span><span class="hex" data-token="--ink-3"></span><span class="hex" style="color:var(--ink-3)">bullet glyphs, subdued meta</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:var(--ink-4);"></div>
    <div class="lbl"><span class="name">--ink-4 · quaternary</span><span class="hex" data-token="--ink-4"></span><span class="hex" style="color:var(--ink-3)">separators, disabled</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background-color:var(--bg); background-image:linear-gradient(var(--bg-rule),var(--bg-rule));"></div>
    <div class="lbl"><span class="name">--bg-rule · hairline</span><span class="hex">10% ink-1</span><span class="hex" style="color:var(--ink-3)">section header rules</span></div>
  </div>
</div>
<script>
for (const el of document.querySelectorAll('[data-token]')) {
  el.textContent = getComputedStyle(document.documentElement).getPropertyValue(el.dataset.token).trim().toUpperCase();
}
</script>
</body></html>
