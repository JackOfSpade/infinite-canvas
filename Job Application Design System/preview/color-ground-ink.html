<!doctype html>
<!-- @dsCard group="Colors" name="Color · Ground & Ink" subtitle="Warm off-white ground + four ink levels + hairline rule" viewport="700x280" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; }
  .swatch .chip { height: 60px; }
</style>
</head><body>
<div class="grid">
  <div class="swatch">
    <div class="chip" style="background:#F7F4ED;"></div>
    <div class="lbl"><span class="name">--bg · ground</span><span class="hex">#F7F4ED</span><span class="hex" style="color:var(--ink-3)">warm off-white, never #FFF</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#1A1815;"></div>
    <div class="lbl"><span class="name">--ink-1 · primary</span><span class="hex">#1A1815</span><span class="hex" style="color:var(--ink-3)">body, role title, name</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#54504A;"></div>
    <div class="lbl"><span class="name">--ink-2 · secondary</span><span class="hex">#54504A</span><span class="hex" style="color:var(--ink-3)">dates, locations, summary</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#8C857A;"></div>
    <div class="lbl"><span class="name">--ink-3 · tertiary</span><span class="hex">#8C857A</span><span class="hex" style="color:var(--ink-3)">scope, trade-off, captions</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#B6AFA2;"></div>
    <div class="lbl"><span class="name">--ink-4 · quaternary</span><span class="hex">#B6AFA2</span><span class="hex" style="color:var(--ink-3)">separators, disabled</span></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:rgba(26,24,21,0.10); background-color:#F7F4ED; background-image:linear-gradient(rgba(26,24,21,0.10),rgba(26,24,21,0.10));"></div>
    <div class="lbl"><span class="name">--bg-rule · hairline</span><span class="hex">10% ink-1</span><span class="hex" style="color:var(--ink-3)">section header rules</span></div>
  </div>
</div>
</body></html>
