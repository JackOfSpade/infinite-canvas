<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Page Geometry" subtitle="8.5×11in · 0.72in top/bot · 0.78in side · 1.45in date column" viewport="700x380" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .geo { display: grid; grid-template-columns: 180px 1fr; gap: 22px; align-items: stretch; }
  .page-vis {
    aspect-ratio: 8.5 / 11;
    background: var(--bg);
    border: 0.5pt solid rgba(26,24,21,0.22);
    position: relative;
    padding: 9.5% 11.5%;        /* 0.72 / 0.78 in approx */
    box-sizing: border-box;
  }
  .page-vis .col-main {
    position: absolute;
    inset: 9.5% 11.5%;
    background: rgba(26,24,21,0.04);
    border: 0.25pt dashed rgba(26,24,21,0.30);
  }
  .page-vis .col-meta {
    position: absolute;
    right: 11.5%; top: 9.5%; bottom: 9.5%;
    width: 17%;
    background: rgba(122,31,43,0.06);
    border-left: 0.25pt dashed rgba(122,31,43,0.40);
  }
  .specs { font-size: 9pt; color: var(--ink-2); line-height: 1.55; }
  .specs strong { color: var(--ink-1); font-weight: 500; }
  .specs .mono { font-family: var(--ff-mono); font-size: 8.5pt; color: var(--ink-3); letter-spacing: -0.005em; }
</style>
</head><body>
<div class="geo">
  <div class="page-vis">
    <div class="col-main"></div>
    <div class="col-meta"></div>
  </div>
  <div class="specs">
    <div><strong>Letter</strong> · 8.5 × 11 in</div>
    <div>Margins · 0.72 in top/bot · 0.78 in side</div>
    <div>Text column · ~6.94 in</div>
    <div>Date/loc cell · 1.45 in (visual right-align, <em>not</em> a second column)</div>
    <div style="margin-top:8px;" class="mono">--page-w · --page-h · --margin-top · --margin-side · --col-meta-w</div>
  </div>
</div>
</body></html>
