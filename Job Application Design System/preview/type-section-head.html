<!doctype html>
<!-- @dsCard group="Type" name="Type · Section Head" subtitle="9pt uppercase tracked 0.14em + hairline rule" viewport="700x180" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .head-demo { display: flex; flex-direction: column; gap: 28px; }
  .head { display: flex; align-items: baseline; gap: 16px; }
  .head h2 { font-family: var(--ff-body); font-size: 9pt; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-1); margin: 0; }
  .head .rule { flex: 1; height: 0.5pt; background: rgba(26,24,21,0.10); align-self: center; margin-top: 1pt; }
  .anno { font-family: var(--ff-mono); font-size: 8.5pt; color: var(--ink-3); letter-spacing: -0.005em; margin-top: 4px; }
</style>
</head><body>
<div class="head-demo">
  <div>
    <div class="head"><h2>Experience</h2><span class="rule"></span></div>
    <div class="anno">9 pt · Inter Medium · 0.14em tracked · hairline rule at 10% ink fills the line</div>
  </div>
  <div>
    <div class="head"><h2>Selected Systems</h2><span class="rule"></span></div>
    <div class="anno">Always conventional labels: Experience · Selected Systems · Skills. Never "My Journey". No Education section exists.</div>
  </div>
</div>
</body></html>
