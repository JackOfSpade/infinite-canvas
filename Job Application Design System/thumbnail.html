<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;padding:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--ff-body)}
  .main{flex:1;background:var(--accent);display:flex;align-items:center;justify-content:center}
  .main span{font-family:var(--ff-display);font-weight:var(--fw-semibold);font-size:100px;line-height:1.1;letter-spacing:var(--tr-display);color:var(--bg);text-align:center}
  .swatches{width:130px;display:flex;flex-direction:column}
  .swatches div{flex:1}
</style>
</head><body>
<div class="tile">
  <div class="main"><span>Job<br>Application</span></div>
  <div class="swatches">
    <div style="background:#F7F4ED"></div>
    <div style="background:#B6AFA2"></div>
    <div style="background:#7A1F2B"></div>
    <div style="background:#1A1815"></div>
  </div>
</div>
</body></html>
