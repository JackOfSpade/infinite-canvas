<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .frame {
    height: 100vh;
    background: linear-gradient(180deg, #EEE9DC 0%, #E6E0CF 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    padding: 26px 30px 22px;
    box-shadow: 0 1px 0 rgba(26,24,21,0.04), 0 18px 36px -16px rgba(26,24,21,0.22);
    box-sizing: border-box;
  }
  .name {
    font-family: var(--ff-display); font-weight: 600;
    font-size: 22pt; line-height: 1.05; letter-spacing: -0.012em;
    color: var(--accent); margin: 0 0 4px;
  }
  .tag { font-size: 9.5pt; color: var(--ink-2); margin: 0 0 14px; letter-spacing: -0.005em; }
  .head { display: flex; align-items: baseline; gap: 12px; }
  .head h2 { font-family: var(--ff-body); font-size: 8pt; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; margin: 0; }
  .head .rule { flex: 1; height: 0.5pt; background: rgba(26,24,21,0.12); margin-top: 1pt; }
</style>
</head><body>
<div class="frame">
  <div class="sheet">
    <h1 class="name">Anya R. Castellanos</h1>
    <p class="tag">Staff Engineer · distributed systems &amp; storage infrastructure</p>
    <div class="head"><h2>Experience</h2><span class="rule"></span></div>
  </div>
</div>
</body></html>
