<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 14px; }
  .head h2 { font-family: var(--ff-body); font-size: 9pt; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; margin: 0; }
  .head .rule { flex: 1; height: 0.5pt; background: rgba(26,24,21,0.10); margin-top: 1pt; }
  .rh { display: grid; grid-template-columns: 1fr auto; column-gap: 22px; align-items: baseline; margin-bottom: 4px; }
  .rh .t { font-size: 11pt; font-weight: 600; }
  .rh .t .sep { color: var(--ink-4); margin: 0 0.35em; font-weight: 400; }
  .rh .d { font-size: 9.5pt; color: var(--ink-2); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
  .rm { display: grid; grid-template-columns: 1fr auto; column-gap: 22px; align-items: baseline; margin-bottom: 8px; }
  .rm .s { font-size: 9.5pt; color: var(--ink-2); font-style: italic; }
  .rm .l { font-size: 9.5pt; color: var(--ink-2); text-align: right; white-space: nowrap; }
  .b { padding-left: 1.05em; position: relative; font-size: 10.25pt; line-height: 1.45; margin: 0 0 4px; }
  .b::before { content: "•"; position: absolute; left: 0; color: var(--ink-3); }
  .b strong { font-weight: 600; }
</style>
</head><body>
<div class="head"><h2>Experience</h2><span class="rule"></span></div>
<div class="rh">
  <div class="t"><span>Staff Engineer</span><span class="sep">·</span><span>Tessera Labs</span></div>
  <div class="d">Mar 2022 – Present</div>
</div>
<div class="rm">
  <div class="s">Storage platform — tech lead, team of 8; query, ingest, replication.</div>
  <div class="l">Brooklyn, NY</div>
</div>
<p class="b">Designed sharding for the timeseries write path at <strong>1.4M QPS</strong>, p99 <strong>38 ms</strong>.</p>
<p class="b">Led query layer rewrite; p99 latency <strong>2.1 s → 340 ms</strong> at constant cost.</p>
</body></html>
