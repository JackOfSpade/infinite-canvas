<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  dl.skills { display: grid; grid-template-columns: 145px 1fr; column-gap: 22px; row-gap: 6px; margin: 0; }
  dl.skills dt { font-size: 9.5pt; color: var(--ink-2); font-weight: 500; letter-spacing: -0.005em; }
  dl.skills dd { margin: 0; font-family: var(--ff-mono); font-size: 9pt; letter-spacing: -0.005em; color: var(--ink-1); line-height: 1.35; }
  dl.skills dd .sep { color: var(--ink-4); margin: 0 0.35em; }
</style>
</head><body>
<dl class="skills">
  <dt>Languages</dt>
  <dd>Go<span class="sep">·</span>Rust<span class="sep">·</span>Python<span class="sep">·</span>TypeScript<span class="sep">·</span>SQL</dd>
  <dt>Distributed&nbsp;Systems</dt>
  <dd>Raft<span class="sep">·</span>Paxos<span class="sep">·</span>CRDTs<span class="sep">·</span>consistent hashing<span class="sep">·</span>gossip</dd>
  <dt>Data</dt>
  <dd>Postgres<span class="sep">·</span>ClickHouse<span class="sep">·</span>FoundationDB<span class="sep">·</span>Kafka</dd>
  <dt>Observability</dt>
  <dd>OpenTelemetry<span class="sep">·</span>Prometheus<span class="sep">·</span>Honeycomb</dd>
</dl>
</body></html>
