<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .scale { display: grid; grid-template-columns: 80px 1fr 200px; row-gap: 6px; column-gap: 14px; align-items: center; }
  .scale .tok { font-family: var(--ff-mono); font-size: 9pt; color: var(--ink-2); letter-spacing: -0.005em; }
  .scale .bar { height: 10px; background: #1A1815; }
  .scale .use { font-size: 9pt; color: var(--ink-3); }
</style>
</head><body>
<div class="scale">
  <span class="tok">--s-1</span><span class="bar" style="width:2pt"></span><span class="use">2 pt · micro nudges</span>
  <span class="tok">--s-2</span><span class="bar" style="width:4pt"></span><span class="use">4 pt · name ↔ tagline</span>
  <span class="tok">--s-3</span><span class="bar" style="width:6pt"></span><span class="use">6 pt · bullet ↔ bullet</span>
  <span class="tok">--s-4</span><span class="bar" style="width:8pt"></span><span class="use">8 pt · meta ↔ first bullet</span>
  <span class="tok">--s-5</span><span class="bar" style="width:12pt"></span><span class="use">12 pt · project ↔ project</span>
  <span class="tok">--s-6</span><span class="bar" style="width:16pt"></span><span class="use">16 pt · head ↔ section body</span>
  <span class="tok">--s-8</span><span class="bar" style="width:24pt"></span><span class="use">24 pt · role ↔ role</span>
  <span class="tok">--s-9</span><span class="bar" style="width:32pt"></span><span class="use">32 pt · section ↔ section</span>
  <span class="tok">--s-10</span><span class="bar" style="width:40pt"></span><span class="use">40 pt · reserved</span>
</div>
</body></html>
