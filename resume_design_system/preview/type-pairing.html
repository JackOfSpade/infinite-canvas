<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
  }
  .specimen { padding-top: 4px; }
  .specimen .glyph { line-height: 1; color: var(--ink-1); }
  .specimen .meta { margin-top: 8px; }
  .display .glyph { font-family: var(--ff-display); font-weight: 600; font-size: 40pt; letter-spacing: -0.012em; color: var(--accent); }
  .body    .glyph { font-family: var(--ff-body);    font-weight: 500; font-size: 28pt; letter-spacing: -0.005em; }
  .mono    .glyph { font-family: var(--ff-mono);    font-weight: 400; font-size: 24pt; letter-spacing: -0.005em; }
</style>
</head><body>
<div class="pair">
  <div class="specimen display">
    <div class="glyph">Aa</div>
    <div class="meta">Source Serif 4 · Semibold · display only</div>
  </div>
  <div class="specimen body">
    <div class="glyph">Aa</div>
    <div class="meta">Inter · 400 / 500 / 600 / 700 · body, headings, meta</div>
  </div>
  <div class="specimen mono">
    <div class="glyph">Aa</div>
    <div class="meta">IBM Plex Mono · 400–500 · technologies</div>
  </div>
</div>
</body></html>
