document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\" data-print=\"dual-pdf\"><head>\n<meta charset=\"utf-8\">\n<title>Anya R. Castellanos · Staff Engineer<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<!-- Design tokens (typography, color, spacing) -->\n<style>@charset \"utf-8\";\n/* ============================================================\n   Editorial Resume Design System — design tokens\n   ----------------------------------------------------------\n   Type:    Source Serif 4 (display, local ttf)  ·  Inter (body,\n            local woff2)  ·  IBM Plex Mono (technologies, local ttf)\n            All three families are bundled locally — zero network\n            dependencies at render time.\n   Color:   Warm off-white ground · deep warm ink · one oxblood\n            accent, used sparingly (default: candidate name only)\n   Units:   Print-first. Sizes given in pt so they survive PDF\n            export at exact metric. The root `html` font-size is\n            bound to --fs-body (10.25pt) — so 1rem == 10.25pt.\n            Spacing tokens are absolute (pt), not rem-derived;\n            change --fs-body without disturbing the spacing scale.\n   ============================================================ */\n\n/* All three families ship locally — no Google Fonts CDN dependency. */\n\n/* ---------- Source Serif 4 (local) ---------- */\n@font-face {\n  font-family: \"Source Serif 4\";\n  src: url(\"f639dfca-559c-4d81-8097-0e0df6f25c71\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Source Serif 4\";\n  src: url(\"4749809d-3ddc-43ba-96ef-003e9f4b43f2\") format(\"truetype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ---------- IBM Plex Mono (local) ---------- */\n@font-face {\n  font-family: \"IBM Plex Mono\";\n  src: url(\"a0682831-a090-4b3b-8dab-4679d6e77a44\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"IBM Plex Mono\";\n  src: url(\"8c0da61e-1c4b-4780-8429-094c9d836a63\") format(\"truetype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ---------- Inter (local) ---------- */\n@font-face {\n  font-family: \"Inter\";\n  src: url(\"5c50620d-1604-446a-99a6-cf8afdc3ca42\") format(\"woff2\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Inter\";\n  src: url(\"156375cb-0387-4d55-930d-200c95e67ca7\") format(\"woff2\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Inter\";\n  src: url(\"02f34af4-793e-4544-914d-75dec96e688e\") format(\"woff2\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n/* Inter-Bold (700) is intentionally NOT loaded. The system uses\n   SemiBold (600) for every \"bold\" affordance — body <strong>, role\n   titles, project names, candidate name. Loading 700 invites drift\n   toward a heavier, less editorial voice. If a future variant truly\n   needs 700, add the @font-face here AND the --fw-bold token below. */\n\n:root {\n  /* ---------- Color · ground ----------\n     Warm off-white, ~4% warm tint. The whole \"ink on warm paper\"\n     reading depends on this being a coloured ground, not white.\n\n     NOTE: keep in sync with `DEFAULT_CREAM_RGB` in\n     `build/dual-mode-pdf.js`. That module paints this colour as\n     the OCG background layer in the generated PDF; if the two\n     drift, the on-screen design colour and the printed-PDF\n     background colour will mismatch. Better: pass `--bg`'s actual\n     value into `addOcgBackground({ cream: '#F7F4ED' })` at the\n     call site so the CSS token stays authoritative. */\n  --bg:          #F7F4ED;\n  --bg-rule:    rgba(26, 24, 21, 0.10); /* hairline rule color */\n\n  /* ---------- Color · ink (text) ----------\n     Positional tokens (--ink-1..4) are the canonical declarations.\n     Semantic aliases (--ink-body, --ink-meta, --ink-quiet,\n     --ink-fade) are exposed below and are the preferred reference\n     in new code; the positional names remain in place for\n     backward compatibility and for cases where the *position* in\n     the scale is what's being expressed (e.g. selector cascades). */\n  --ink-1:       #1A1815;   /* primary — body, role titles    */\n  --ink-2:       #54504A;   /* secondary — dates, locations   */\n  --ink-3:       #8C857A;   /* tertiary — bullet glyphs       */\n  --ink-4:       #B6AFA2;   /* quaternary — separators, fades */\n\n  /* Semantic aliases — prefer these in component CSS. */\n  --ink-body:    var(--ink-1);   /* body copy, role titles, names */\n  --ink-meta:    var(--ink-2);   /* dates, locations, annotations */\n  --ink-quiet:   var(--ink-3);   /* glyphs, the most subdued meta */\n  --ink-fade:    var(--ink-4);   /* separators, \"trade-off:\" leads */\n\n  /* ---------- Color · accent ---------- */\n  /* Default usage: candidate name ONLY. The single override point\n     is --accent-on. Set it to var(--ink-1) for a pure-monochrome\n     variant — either at :root, or scoped to a .page node:\n        <main class=\"page\" style=\"--accent-on: var(--ink-1)\">…\n     Do NOT introduce a second accent token. */\n  --accent:      #7A1F2B;   /* oxblood — quiet, ink-like      */\n  --accent-on:   var(--accent);\n\n  /* ---------- Type · families ---------- */\n  --ff-display:  \"Source Serif 4\", \"Source Serif Pro\", Georgia, \"Times New Roman\", serif;\n  --ff-body:     \"Inter\", -apple-system, \"Helvetica Neue\", Arial, sans-serif;\n  --ff-mono:     \"IBM Plex Mono\", \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* ---------- Type · scale (pt for print fidelity) ---------- */\n  --fs-display:  28pt;      /* candidate name                 */\n  --fs-h1:       18pt;      /* document title (rarely used)   */\n  --fs-h2:        9pt;      /* section header (uppercase)     */\n  --fs-h3:       11pt;      /* role title / company           */\n  --fs-body:     10.25pt;   /* bullets, paragraphs            */\n  --fs-small:     9.5pt;    /* meta (dates, location)         */\n  --fs-caption:   8.75pt;   /* scope chip, tradeoff note      */\n  --fs-mono:      9pt;      /* inline technologies            */\n\n  /* ---------- Type · weight ---------- */\n  /* Inter Light (300) and Bold (700) are not bundled — by design.\n     The system uses SemiBold (600) for every \"bold\" affordance to\n     keep the voice quietly confident, not loud. */\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n\n  /* ---------- Type · leading ---------- */\n  --lh-display:  1.05;\n  --lh-tight:    1.20;\n  --lh-snug:     1.35;\n  --lh-body:     1.45;\n  --lh-loose:    1.55;\n\n  /* ---------- Vertical rhythm ----------\n     A computed token equal to one body line-box (fs-body × lh-body\n     ≈ 14.86pt). Use multiples of this for between-block spacing\n     where vertical rhythm matters (section ↔ section, header ↔ body,\n     role ↔ role). The 4pt --s-* scale below is finer-grained and\n     used for inline / intra-block spacing. The two systems coexist\n     by design: --baseline keeps the *page* on a grid; --s-* keeps\n     *elements* visually tight without forcing 4pt arithmetic onto\n     every gap. */\n  --baseline:    calc(var(--fs-body) * var(--lh-body));\n  --vr-half:     calc(var(--baseline) * 0.5);   /* ~7.4pt  */\n  --vr-1:        var(--baseline);                /* ~14.9pt */\n  --vr-1-5:      calc(var(--baseline) * 1.5);   /* ~22.3pt */\n  --vr-2:        calc(var(--baseline) * 2);     /* ~29.7pt */\n\n  /* ---------- Type · tracking ---------- */\n  --tr-display:  -0.012em;\n  --tr-h2:        0.14em;   /* uppercase tracked              */\n  --tr-mono:     -0.005em;\n  --tr-tight:    -0.005em;\n\n  /* ---------- Inline separators ----------\n     The `·` separator appears in many contexts (contact line,\n     role title, edu line, metrics, skills run). Two gap sizes\n     cover every usage: tight for prose-adjacent runs, loose for\n     mono / numeric / metric lines where digits need air. */\n  --sep-gap-tight: 0.35em;\n  --sep-gap-loose: 0.5em;\n\n  /* ---------- Spacing · 4pt baseline ---------- */\n  --s-0:   0;\n  --s-1:   2pt;\n  --s-2:   4pt;\n  --s-3:   6pt;\n  --s-4:   8pt;\n  --s-5:  12pt;\n  --s-6:  16pt;\n  --s-7:  20pt;\n  --s-8:  24pt;\n  --s-9:  32pt;\n  --s-10: 40pt;\n\n  /* ---------- Page geometry (Letter) ---------- */\n  --page-w:        8.5in;\n  --page-h:       11.0in;\n  --margin-top:    0.72in;\n  --margin-bot:    0.72in;\n  --margin-side:   0.78in;\n  --rule-weight:   0.5pt;\n\n  /* ---------- Layout columns (single primary column) ---------- */\n  --col-meta-w:   1.45in;   /* right-aligned date/location column\n                               — visual alignment, NOT a 2-col flow */\n  --col-gap:      0.32in;\n}\n\n/* ============================================================\n   Semantic / element-level defaults\n   These are the rules that apply when nothing else is set —\n   the document's resting voice.\n   ============================================================ */\n\nhtml {\n  background: var(--bg);\n  color: var(--ink-1);\n  font-family: var(--ff-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  /* kern/liga/calt: universal text rendering hygiene — these shape\n     LETTERS only and round-trip cleanly through PDF text extraction.\n\n     tnum (tabular numerals) is deliberately NOT enabled, and must not\n     be. Inter's tabular figures are GSUB-substituted glyphs with no\n     `cmap` entry, so Chrome's print-to-PDF subsetter can't reverse-map\n     them to U+0030–0039 — it assigns Private-Use-Area codepoints\n     instead. The numbers then render correctly on screen but extract\n     as nothing: every QPS, $, %, and date silently drops out of the\n     PDF text layer, and therefore out of ATS parsing, copy-paste, and\n     screen readers. Parse-safety beats digit-column alignment\n     (STYLE.md §1); the right-aligned date cell is aligned by the grid,\n     not by monospaced figures. Do NOT add \"tnum\" (or \"pnum\"/\"lnum\"/\n     \"onum\") here — they all trip the same substitution hazard.\n\n     No stylistic-set toggles (ss01 etc.) either — they do different\n     things across the three families and would leak family-specific\n     behavior into the global default. */\n  font-feature-settings: \"kern\", \"liga\", \"calt\";\n  /* Preserve the warm ground in print. Without this, Chrome strips\n     --bg to save toner and the \"ink on warm paper\" reading collapses\n     to plain black-on-white. The whole aesthetic depends on this. */\n  -webkit-print-color-adjust: exact;\n  print-color-adjust: exact;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n/* Screen-only focus ring. The artifact is a PDF first, but the\n   screen preview is interactive — the browser-default ring on a\n   warm-serif document is jarring. This one stays in family. */\n:focus { outline: none; }\n:focus-visible {\n  outline: 1.5pt solid var(--ink-3);\n  outline-offset: 2pt;\n  border-radius: 0;\n}\n@media print {\n  :focus, :focus-visible { outline: none; }\n}\n\nbody { margin: 0; }\n\np   { margin: 0 0 var(--s-4); }\nb, strong { font-weight: var(--fw-semibold); color: var(--ink-1); }\nem, i     { font-style: italic; }\nsmall     { font-size: var(--fs-small); color: var(--ink-2); }\n\na {\n  color: inherit;\n  text-decoration: none;\n  border-bottom: 0.5pt solid var(--bg-rule);\n}\na:hover { border-bottom-color: var(--ink-2); }\n\ncode, kbd, samp {\n  font-family: var(--ff-mono);\n  font-size: 0.92em;\n  letter-spacing: var(--tr-mono);\n  color: var(--ink-2);\n}\n\nul { margin: 0; padding: 0; list-style: none; }\n\n/* ============================================================\n   Variants\n   ----------------------------------------------------------\n   Opt-in alternate configurations. Apply by setting a data\n   attribute on the .page element (or on :root for the whole\n   document). Each variant is a closed override block — adding\n   a third should follow the same shape.\n   ============================================================ */\n\n/* ---------- A4 paper ----------\n   Letter is 8.5\" wide, A4 is 8.27\" wide. Keeping the same 0.78in\n   side margin would give a different measure (chars per line),\n   breaking Butterick's editorial sweet spot. Recompute the margins\n   so the content width is preserved at ~6.94in.\n\n   Apply with:  <main class=\"page\" data-page=\"a4\">…\n   or globally: <html data-page=\"a4\">\n\n   The physical paper size is selected by CSS named pages declared\n   in `resume.html` (`@page a4 { size: A4 }` + `page: a4` on the\n   element). No separate top-level override is required. */\n[data-page=\"a4\"] {\n  --page-w:      210mm;   /* 8.27in */\n  --page-h:      297mm;   /* 11.69in */\n  --margin-top:   18mm;   /* ~0.71in — preserves vertical rhythm */\n  --margin-bot:   18mm;\n  --margin-side:  16mm;   /* ~0.63in — keeps measure ≈ 70-75ch  */\n}\n\n/* ---------- Monochrome ----------\n   Pure ink, no oxblood accent. The candidate name renders in\n   --ink-1. Useful for B&W laser pipelines or when the recipient\n   org has a documented aversion to colour on résumés.\n\n   Apply with:  <main class=\"page\" data-mono>…\n   or globally: <html data-mono>                                 */\n[data-mono] {\n  --accent-on: var(--ink-1);\n}\n\n/* ---------- Density: compact ----------\n   Tightens vertical rhythm and shrinks body type ~5% to claw back\n   roughly 6–9 lines per page. The intended use is the single\n   lever a user reaches for when content overflows by a small\n   margin — \"1.1 pages, want 1.0\" — without rewriting bullets.\n\n   Tokens that change:\n   - body type drops 10.25 → 9.75pt; leading 1.45 → 1.35\n   - meta sizes follow proportionally\n   - block-spacing tokens (s-6 / s-8 / s-9) drop roughly 25%\n   - page margins shrink 0.72 → 0.6in head/foot\n\n   Tokens deliberately untouched:\n   - --fs-display (the name) — shrinking the name to fit content\n     is the wrong trade\n   - --col-meta-w — date strings keep the same metrics\n   - --rule-weight, accent, families — visual identity unchanged\n\n   Apply with:  <main class=\"page\" data-density=\"compact\">…\n   or globally: <html data-density=\"compact\">\n\n   Pairs cleanly with `data-page=\"a4\"` and `data-mono`. Do not\n   nest density variants — there is one. If \"compact\" still\n   overflows, the content is the problem; trim a bullet.       */\n[data-density=\"compact\"] {\n  --fs-body:      9.75pt;\n  --fs-small:     9pt;\n  --fs-caption:   8.5pt;\n  --fs-mono:      8.5pt;\n  --lh-body:      1.35;\n  --lh-snug:      1.25;\n\n  --s-6:         12pt;   /* was 16pt — section head ↔ body   */\n  --s-8:         18pt;   /* was 24pt — role ↔ role           */\n  --s-9:         24pt;   /* was 32pt — section ↔ section     */\n\n  --margin-top:  0.6in;\n  --margin-bot:  0.6in;\n}\n\n/* ---------- Print: ink-only ----------\n   Flips the warm ground to pure white **only when printing**. Screen\n   preview keeps the editorial warm cream — this is purely a paper /\n   toner concession for recipients who expect or require white stock.\n\n   Coloured text is unaffected. `print-color-adjust: exact` (set on\n   `html` above) keeps any explicitly-coloured ink rendering at its\n   true value, so the oxblood `--accent-on` on the candidate name\n   still prints in colour. Only `--bg` flips, and `--bg-rule` is\n   nudged from 10% to 16% ink so the hairline rules survive on a\n   pure-white field (the rule colour is a translucent ink overlay;\n   over warm cream the visual contrast is slightly higher than over\n   white, so we compensate).\n\n   Apply with:  <main class=\"page\" data-print=\"ink-only\">…\n   or globally: <html data-print=\"ink-only\">\n\n   Pairs cleanly with `data-page=\"a4\"`, `data-mono`, and\n   `data-density=\"compact\"`. If you also set `data-mono`, the printed\n   page is plain ink-on-white — equivalent to a traditional B&W\n   résumé without rewriting any content.                            */\n@media print {\n  [data-print=\"ink-only\"] {\n    --bg:        #FFFFFF;\n    --bg-rule:   rgba(26, 24, 21, 0.16);\n  }\n  /* The print-mode rule in resume.css paints html + body from\n     `var(--bg)`. Because `--bg` is a CSS custom property, it resolves\n     against the *element it's read on* — putting `data-print=\"ink-only\"`\n     on `<main class=\"page\">` overrides --bg on that subtree only, NOT\n     on html/body. Without the mirror below, html/body would keep the\n     warm cream and a résumé shorter than one full page would show a\n     band of cream below the white card.\n\n     `:has()` lets us flip the sheet background whenever ANY page on the\n     document opts into ink-only — so the attribute works whether it\n     lives on <html>, <body>, or an individual <main class=\"page\">. */\n  html:has([data-print=\"ink-only\"]),\n  html:has([data-print=\"ink-only\"]) body,\n  html[data-print=\"ink-only\"],\n  html[data-print=\"ink-only\"] body { background: #FFFFFF; }\n}\n\n/* ---------- Print: dual-pdf  (default for PDF generation) ----------\n   Strips ALL background from the printed page so a headless-Chrome\n   \"print to PDF\" emits a file with no baked-in background fill in\n   the page content stream. The companion build module\n   (`build/dual-mode-pdf.js`) then post-processes that PDF, adding a\n   cream rectangle in a view-only OCG (Optional Content Group, PDF\n   spec §8.11). The result is a SINGLE PDF that:\n\n       • shows warm cream + oxblood name when viewed on screen\n       • prints on clean white paper, oxblood name preserved\n       • requires no settings change from the recipient\n\n   Coloured text (the oxblood candidate name, any future accent ink)\n   is unaffected in either state because it is part of the page\n   content stream, not the OCG-layered background. `print-color-adjust:\n   exact` (set on `html` above) carries it through Chrome's print\n   pipeline at its true CMYK / RGB value, so a color printer renders\n   it in oxblood and a B&W printer renders it as a dark grey — exactly\n   the same behavior as ordinary coloured text in any PDF.\n\n   --bg-rule is bumped to 16% ink (from the default 10%) for the same\n   reason as ink-only: hairline rules must remain visible when the\n   cream layer is hidden during print. On the cream view, the rule\n   appears very slightly heavier than the default 10% — an acceptable\n   trade for printability.\n\n   Apply with:  <main class=\"page\" data-print=\"dual-pdf\">…\n   or globally: <html data-print=\"dual-pdf\">\n\n   This is the DEFAULT in resume.html. To opt out (e.g. you want a\n   one-state cream-baked PDF for a context where the recipient will\n   not print), remove the attribute or switch to data-print=\"ink-only\".\n\n   Pairs cleanly with `data-page=\"a4\"`, `data-mono`, and\n   `data-density=\"compact\"`.                                          */\n@media print {\n  [data-print=\"dual-pdf\"] {\n    --bg:        transparent;\n    --bg-rule:   rgba(26, 24, 21, 0.16);\n  }\n  /* Same html/body mirror trick as ink-only, but flipping to\n     transparent instead of white. With nothing drawn for the\n     background, a headless-Chrome \"print to PDF\" emits a page\n     content stream with no background fill — exactly what the OCG\n     post-processor needs in order to layer cream as the bottom-most\n     drawn element. */\n  html:has([data-print=\"dual-pdf\"]),\n  html:has([data-print=\"dual-pdf\"]) body,\n  html[data-print=\"dual-pdf\"],\n  html[data-print=\"dual-pdf\"] body { background: transparent; }\n}\n\n\n\n<\u002Fstyle>\n\n<!-- Components: page chrome, sections, roles, bullets, etc. -->\n<style>@charset \"utf-8\";\n/* ============================================================\n   resume.css — components & page chrome\n   ----------------------------------------------------------\n   Pair with `colors_and_type.css` (tokens + element defaults).\n   This file covers everything specific to the résumé surface:\n   page chrome (screen preview + paged media), the header, section\n   heads, the meta-row utility, role / project / skills / education\n   blocks, bullets, inline separators and annotations.\n\n   Semantic markup maps 1:1 to JSON Resume v1.0.0 + the following\n   namespaced custom fields:\n     work[].highlights[i].x_scope     → .scope\n     work[].highlights[i].x_tradeoff  → .tradeoff\n     work[].x_summary                 → .role-summary\n     projects[].x_metrics             → .project-metrics\n   Full mapping table lives in STYLE.md §9.\n   ============================================================ */\n\n/* -------- viewport / page chrome (screen preview only) -------- */\n@media screen {\n  body {\n    padding: 32px 16px 64px;\n    background:\n      radial-gradient(ellipse at top,\n        #EEE9DC 0%, #E6E0CF 60%, #DCD5C2 100%);\n    min-height: 100vh;\n  }\n  .page {\n    background: var(--bg);\n    width: var(--page-w);\n    min-height: var(--page-h);\n    margin: 0 auto 24px;\n    padding: var(--margin-top) var(--margin-side) var(--margin-bot);\n    box-shadow:\n      0 1px 0 rgba(26,24,21,0.04),\n      0 24px 48px -16px rgba(26,24,21,0.18),\n      0 4px 12px -4px rgba(26,24,21,0.10);\n    box-sizing: border-box;\n  }\n}\n\n/* -------- print: CSS Paged Media --------\n   Named pages let the data-page attribute fully control paper size.\n   Chromium 85+ honours `page: <name>` on an element + matching\n   `@page <name> { size: ... }` rules — no top-level override needed.\n   The margin tokens inside .page are recomputed by the data-page\n   variant block in colors_and_type.css.\n\n   Running footer:\n   The @bottom-right margin box prints the page number on every\n   page except the first. Styling is hardcoded because CSS custom\n   properties don't reliably cascade into @page contexts across\n   engines; values mirror the mono / --ink-quiet tokens so the\n   footer stays in family. Page 1 is suppressed via `:first` —\n   a one-page resume should never show \"1\". */\n@page letter {\n  size: Letter;\n  /* Vertical margins live HERE, not as .page padding, so they repeat\n     on every printed page. Padding on a page-breaking element only\n     applies top-pad to the first fragment and bottom-pad to the last,\n     which left pages 2+ with no top margin. Side margins stay as\n     .page padding so they remain token-driven (a4 / density variants). */\n  margin: 0.72in 0;\n  @bottom-right {\n    content: counter(page) \" / \" counter(pages);\n    font-family: \"IBM Plex Mono\", \"SF Mono\", Menlo, Consolas, monospace;\n    font-size: 8.5pt;\n    color: #8C857A;       /* --ink-quiet */\n    margin: 0 0.78in 0.4in 0;\n    letter-spacing: -0.005em;\n  }\n}\n@page letter:first { @bottom-right { content: none; } }\n@page a4 {\n  size: A4;\n  margin: 18mm 0;\n  @bottom-right {\n    content: counter(page) \" / \" counter(pages);\n    font-family: \"IBM Plex Mono\", \"SF Mono\", Menlo, Consolas, monospace;\n    font-size: 8.5pt;\n    color: #8C857A;\n    margin: 0 16mm 12mm 0;\n    letter-spacing: -0.005em;\n  }\n}\n@page a4:first { @bottom-right { content: none; } }\n@page {\n  /* Fallback for engines that don't support named pages — defaults\n     to Letter. Vertical margins repeat per page via @page; side\n     margins are handled by .page padding. */\n  size: Letter;\n  margin: 0.72in 0;\n}\n.page              { page: letter; }\n.page[data-page=\"a4\"],\n[data-page=\"a4\"] .page,\n:root[data-page=\"a4\"] .page { page: a4; }\n@media print {\n  html, body { background: var(--bg); }\n  body { padding: 0; }\n  .page {\n    width: auto;\n    min-height: auto;\n    margin: 0;\n    /* Side padding only — top/bottom margins are on @page so they\n       repeat on every printed page. (Bug fix: pages 2+ were losing\n       their top margin because padding on a fragmented box is applied\n       once, at the first/last fragment, not per page.) */\n    padding: 0 var(--margin-side);\n    box-shadow: none;\n    page-break-after: always;\n  }\n  .page:last-child { page-break-after: auto; }\n}\n\n/* =========================================================\n   Header — name, tagline, contact line. All body text;\n   never use document <header> for parser-critical info.\n   =========================================================*/\n.resume-header {\n  margin-bottom: var(--s-9);\n}\n.name {\n  font-family: var(--ff-display);\n  font-weight: var(--fw-semibold);\n  line-height: var(--lh-display);\n  letter-spacing: var(--tr-display);\n  color: var(--accent-on);\n  margin: 0 0 var(--s-2);\n  /* Screen preview only: shrink the name on narrow viewports\n     (mobile, scaled-down windows) so it still reads gracefully\n     when the page is wider than the viewport. The clamp keys off\n     viewport width, NOT name length — a long name on a desktop\n     viewport still renders at the full token. text-wrap: balance\n     keeps any forced wrap visually centred. */\n  font-size: clamp(calc(var(--fs-display) - 4pt), 4.2vw + 6pt, var(--fs-display));\n  text-wrap: balance;\n}\n@media print {\n  /* Print uses the token directly — deterministic, fixed-paper output. */\n  .name { font-size: var(--fs-display); }\n}\n.tagline {\n  font-size: var(--fs-h3);\n  font-weight: var(--fw-regular);\n  color: var(--ink-meta);\n  margin: 0 0 var(--s-5);\n  letter-spacing: var(--tr-tight);\n}\n.contact {\n  font-size: var(--fs-small);\n  color: var(--ink-body);\n  display: flex;\n  flex-wrap: wrap;\n  gap: 0 var(--s-5);\n  row-gap: var(--s-2);\n}\n.contact a { border-bottom-color: rgba(26,24,21,0.18); }\n\n/* =========================================================\n   Section + subsection heads\n   Small uppercase mark + thin rule that fills the rest of\n   the line. Sections sit on the baseline grid via --vr-2.\n   Subsection: same shape, quieter type, italic.\n   =========================================================*/\n.section {\n  margin-top: var(--vr-2);\n}\n.section:first-of-type { margin-top: 0; }\n\n.section-head,\n.subsection-head {\n  display: flex;\n  align-items: center;          /* center the rule to the heading's optical mid */\n  gap: var(--s-5);\n  break-after: avoid;\n}\n.section-head { margin: 0 0 var(--s-6); }\n.section-head h2 {\n  font-family: var(--ff-body);\n  font-size: var(--fs-h2);\n  font-weight: var(--fw-medium);\n  letter-spacing: var(--tr-h2);\n  text-transform: uppercase;\n  color: var(--ink-body);\n  margin: 0;\n  flex-shrink: 0;\n  line-height: 1;               /* tight box — lets the rule sit at cap mid */\n}\n.section-head .rule,\n.subsection-head .rule {\n  flex: 1;\n  height: var(--rule-weight);\n  background: var(--bg-rule);\n  /* No magic margin-top; align-items:center on the parent + line-height:1\n     on the heading puts the rule at its vertical centre across any font. */\n}\n\n/* Subsection head — quieter, second-tier divider for groupings\n   *inside* a section (\"Open Source\" under Experience, \"Talks\"\n   under Education). Italic sans, no uppercase, no tracked +0.14em.\n   --vr-1 above keeps it on the baseline grid one line-box below\n   the previous block. Render with:\n     <div class=\"subsection-head\">\n       <h3>Open Source<\u002Fh3><span class=\"rule\" aria-hidden=\"true\"><\u002Fspan>\n     <\u002Fdiv>                                                       */\n.subsection-head {\n  margin: var(--vr-1) 0 var(--s-4);\n}\n.subsection-head h3 {\n  font-family: var(--ff-body);\n  font-size: var(--fs-small);\n  font-weight: var(--fw-medium);\n  font-style: italic;\n  letter-spacing: var(--tr-tight);\n  color: var(--ink-meta);\n  margin: 0;\n  flex-shrink: 0;\n  line-height: 1;\n}\n\n/* =========================================================\n   Meta-row utility\n   The \"content left, right-aligned meta right\" pattern\n   appears in role headers, role-meta lines, edu lines, and is\n   available for any future block that needs it. One grid, one\n   class, one place to change column widths.\n\n   Compose it onto the block element; element-specific classes\n   layer typography on top (e.g. .role-header is also a\n   .meta-row, but adds its own break-after rule).\n   =========================================================*/\n.meta-row {\n  display: grid;\n  grid-template-columns: 1fr auto;\n  column-gap: var(--col-gap);\n  align-items: baseline;\n}\n\n/* =========================================================\n   Inline separator (·) used between sibling inline items.\n   Two modifiers cover every usage:\n     default (.sep)    — tight, prose-adjacent runs\n     .sep.sep-loose    — mono / metric / digit-heavy runs\n   Always declared via the modifier class on the span itself;\n   no selector-per-context overrides.\n   =========================================================*/\n.sep {\n  color: var(--ink-fade);\n  user-select: none;\n  font-weight: var(--fw-regular);   /* never inherit bold from context */\n  margin: 0 var(--sep-gap-tight);\n}\n.sep.sep-loose { margin: 0 var(--sep-gap-loose); }\n/* Inside flex layouts the inline margin is harmless—flex gap wins—\n   but we collapse it explicitly so the contact line behaves cleanly\n   on viewports where the flex container's gap is 0. */\n.contact .sep { margin: 0; }\n\n/* =========================================================\n   Role — the core repeating block.\n   Two-line header: (line 1) title · company   ·   dates\n                    (line 2) scope summary     ·   location\n   Below: bullets at full content width.\n   =========================================================*/\n.role {\n  margin-bottom: var(--s-8);\n  /* Don't try to keep a 6-bullet role unsplit — just protect\n     the header and ensure no orphan first bullet. */\n}\n.role:last-child { margin-bottom: 0; }\n\n/* .role-header / .role-meta compose with .meta-row for the grid;\n   these rules only layer role-specific spacing and break behaviour. */\n.role-header {\n  break-after: avoid;\n  margin-bottom: var(--s-3);\n}\n.role-meta {\n  break-after: avoid;\n  margin-bottom: var(--s-4);\n}\n.role-title-line {\n  font-size: var(--fs-h3);\n  font-weight: var(--fw-semibold);\n  color: var(--ink-body);\n  letter-spacing: var(--tr-tight);\n}\n.role-dates {\n  font-size: var(--fs-small);\n  color: var(--ink-meta);\n  text-align: right;\n  white-space: nowrap;\n}\n.role-summary {\n  font-size: var(--fs-small);\n  color: var(--ink-meta);\n  font-style: italic;\n  letter-spacing: var(--tr-tight);\n}\n.role-location {\n  font-size: var(--fs-small);\n  color: var(--ink-meta);\n  text-align: right;\n  white-space: nowrap;\n}\n\n/* =========================================================\n   Highlights / bullets\n   Standard bullet glyph (•), tight enough to scan vertically,\n   roomy enough to wrap to 1.5–2 lines cleanly.\n   =========================================================*/\n.highlights {\n  margin: 0;\n  padding: 0;\n}\n.highlights li {\n  position: relative;\n  padding-left: 1.05em;\n  margin-bottom: var(--s-3);\n  line-height: var(--lh-body);\n  break-inside: avoid;          /* keep a bullet's lines together */\n  orphans: 2;\n  widows: 2;\n}\n.highlights li:last-child { margin-bottom: 0; }\n.highlights li::before {\n  content: \"\\2022\";             /* U+2022 BULLET — escape avoids\n                                   charset / encoding pitfalls */\n  position: absolute;\n  left: 0;\n  top: 0;\n  color: var(--ink-quiet);\n  font-size: 1em;\n  line-height: var(--lh-body);\n}\n\n/* Don't orphan the first bullet from its role header. */\n.role-meta + .highlights > li:first-child,\n.role-header + .highlights > li:first-child { break-before: avoid; }\n\n/* -------- inline annotations on a bullet --------\n   Annotation labels (\"—\", \"· trade-off:\") are written in the\n   HTML as <span class=\"annotation-label\"> rather than injected\n   via CSS `content`. That keeps presentation out of the content\n   layer: labels can be localised, omitted, restyled, or linted\n   from the markup, and copy-paste round-trips correctly (CSS\n   `content` is dropped on copy in many browsers).\n   The annotation classes only style the *text*; the label sits\n   beside the text as a sibling span. */\n.scope, .tradeoff {\n  font-size: var(--fs-caption);\n  color: var(--ink-meta);     /* same as dates / locations — staff-level\n                                 thinking should register on a skim,\n                                 not retreat into footnote grey. */\n  letter-spacing: var(--tr-tight);\n}\n.tradeoff { font-style: italic; }\n.annotation-label {\n  color: var(--ink-fade);\n  font-style: normal;         /* override italic on .tradeoff-label */\n  font-weight: var(--fw-regular);\n}\n\n/* =========================================================\n   Selected Systems / Projects\n   Compact tabular block: name · one-line description · metrics.\n   =========================================================*/\n.project  { margin-bottom: var(--s-5); break-inside: avoid; }\n.project:last-child { margin-bottom: 0; }\n\n.project-name {\n  font-weight: var(--fw-semibold);\n  color: var(--ink-body);\n}\n.project-desc {\n  color: var(--ink-body);\n}\n.project-metrics {\n  display: block;\n  margin-top: var(--s-1);\n  font-family: var(--ff-mono);\n  font-size: var(--fs-mono);\n  letter-spacing: var(--tr-mono);\n  color: var(--ink-meta);\n}\n\n/* =========================================================\n   Skills by category\n   Sans body for the keyword run — mono at 9pt has wider glyph\n   advance than body Inter, which pushes long categories\n   (Distributed Systems, Infrastructure) to extra wraps and\n   widens the perceived measure. Reserve mono for inline <code>.\n   =========================================================*/\n.skills {\n  display: grid;\n  grid-template-columns: var(--col-meta-w) 1fr;\n  column-gap: var(--col-gap);\n  row-gap: var(--s-3);\n}\n.skills dt {\n  font-size: var(--fs-small);\n  color: var(--ink-meta);\n  font-weight: var(--fw-medium);\n  letter-spacing: var(--tr-tight);\n  break-after: avoid;\n}\n.skills dd {\n  margin: 0;\n  font-family: var(--ff-body);\n  font-size: var(--fs-small);\n  color: var(--ink-body);\n  line-height: var(--lh-snug);\n  text-wrap: pretty;\n}\n\n/* =========================================================\n   Education\n   Single line per entry; composes with .meta-row.\n   =========================================================*/\n.edu-line { break-inside: avoid; }\n.edu-line + .edu-line { margin-top: var(--s-3); }\n.edu-school { font-weight: var(--fw-semibold); }\n.edu-meta   { font-size: var(--fs-small); color: var(--ink-meta); white-space: nowrap; }\n\n/* =========================================================\n   Numerals — proportional (font default), NOT tabular.\n   `tabular-nums` / \"tnum\" selects GSUB-only tabular figures that\n   carry no `cmap` entry, so Chrome's PDF subsetter maps them to\n   Private-Use codepoints and EVERY number drops out of the\n   extracted text layer (ATS, copy-paste, screen readers). The\n   date / metric columns are aligned by their grid cell, not by\n   monospaced digits, so nothing visual is lost. Keep this\n   `normal`; do not reintroduce tabular-nums. See STYLE.md §2.4 + §8.\n   =========================================================*/\n.tnum, .role-dates, .project-metrics, .edu-meta {\n  font-variant-numeric: normal;\n}\n<\u002Fstyle>\n<\u002Fhead>\n\n\n\n<body>\n<!-- ============================================================\n     PDF generation\n     ----------------------------------------------------------\n     `data-print=\"dual-pdf\"` on <html> (above) makes the printed\n     page background TRANSPARENT — a headless-Chrome \"print to\n     PDF\" emits a file with no baked-in background. That file is\n     then post-processed by `build/dual-mode-pdf.js` (require it;\n     call `addOcgBackground(bytes)`) which adds a view-only\n     Optional Content Group containing the warm cream. The result\n     is one PDF that shows cream on screen and prints on white\n     paper, with the oxblood candidate name preserved in both\n     states.\n\n     For big-co ATS pipelines and conservative industries the\n     agent should switch the <html> attribute to\n     `data-print=\"ink-only\"` and skip the OCG post-process step.\n     See SKILL.md §Variant selection for the per-company decision\n     rule and STYLE.md §10 for the full variant specification.\n============================================================ -->\n<main class=\"page\" role=\"document\" itemscope=\"\" itemtype=\"https://schema.org/Person\">\n\n<!-- ============= Header (basics) ============= -->\n<header class=\"resume-header\">\n  <h1 class=\"name\" itemprop=\"name\">Anya R. Castellanos<\u002Fh1>\n  <p class=\"tagline\" itemprop=\"jobTitle\">\n    Staff Engineer · distributed systems &amp; storage infrastructure\n  <\u002Fp>\n  <p class=\"contact\" role=\"group\" aria-label=\"Contact\">\n    <span itemprop=\"address\" itemscope=\"\" itemtype=\"https://schema.org/PostalAddress\">\n      <span itemprop=\"addressLocality\">Brooklyn, NY<\u002Fspan>\n    <\u002Fspan>\n    <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n    <a href=\"mailto:anya@castellanos.dev\" itemprop=\"email\">anya@castellanos.dev<\u002Fa>\n    <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n    <a href=\"https://github.com/acastellanos\" itemprop=\"sameAs\">github.com/acastellanos<\u002Fa>\n    <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n    <a href=\"https://linkedin.com/in/anyacastellanos\" itemprop=\"sameAs\">linkedin.com/in/anyacastellanos<\u002Fa>\n    <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n    <a href=\"https://castellanos.dev\" itemprop=\"url\">castellanos.dev<\u002Fa>\n  <\u002Fp>\n<\u002Fheader>\n\n<!-- ============= Experience (work) ============= -->\n<section class=\"section\" aria-labelledby=\"sec-experience\">\n  <div class=\"section-head\">\n    <h2 id=\"sec-experience\">Experience<\u002Fh2>\n    <span class=\"rule\" aria-hidden=\"true\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- Role 1 — Staff @ Tessera (current, 4y) -->\n  <article class=\"role\">\n    <div class=\"role-header meta-row\">\n      <p class=\"role-title-line\">\n        <span class=\"title\">Staff Engineer<\u002Fspan>\n        <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n        <span class=\"company\">Tessera Labs<\u002Fspan>\n      <\u002Fp>\n      <p class=\"role-dates\"><time datetime=\"2022-03\">Mar 2022<\u002Ftime> – <time>Present<\u002Ftime><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"role-meta meta-row\">\n      <p class=\"role-summary\">Storage platform — tech lead, team of 8; query, ingest, replication.<\u002Fp>\n      <p class=\"role-location\">Brooklyn, NY<\u002Fp>\n    <\u002Fdiv>\n    <ul class=\"highlights\">\n      <li>\n        Set technical direction for the storage platform across three sub-teams; chair the\n        platform review forum and own the published service contracts for 14 shared\n        components.\n      <\u002Fli>\n      <li>\n        Designed the sharding strategy for the timeseries write path, sustaining\n        <strong>1.4M QPS<\u002Fstrong> at <strong>p99 38&nbsp;ms<\u002Fstrong> across a 19&nbsp;PB\n        dataset; replaced the prior consistent-hash scheme after it misbalanced under\n        tenant skew.\n        <span class=\"tradeoff\"><span class=\"annotation-label\"> · trade-off: <\u002Fspan>accepted +20&nbsp;ms tail latency for 4× write capacity and\n        bounded hot-shard recovery time.<\u002Fspan>\n      <\u002Fli>\n      <li>\n        Led the query layer rewrite from a Postgres-backed CTE engine to a custom\n        vectorized executor; cut p99 query latency\n        <strong>2.1&nbsp;s → 340&nbsp;ms<\u002Fstrong> at constant cost-per-query.\n        <span class=\"scope\"><span class=\"annotation-label\"> — <\u002Fspan>8 engineers, 11-month project, no read-path regressions in\n        cutover<\u002Fspan>\n      <\u002Fli>\n      <li>\n        Owned the multi-region replication design: 3-region active/active with bounded\n        staleness ≤ 200 ms; chose CRDT-based metadata sync over Raft after benchmarking\n        showed Raft leader-election added ~4 s of unavailability per quorum loss.\n        <span class=\"tradeoff\"><span class=\"annotation-label\"> · trade-off: <\u002Fspan>CRDT vs. Raft — picked eventual convergence for metadata\n        because operator pain on Raft quorum loss outweighed the consistency benefit at\n        our read/write ratio.<\u002Fspan>\n      <\u002Fli>\n      <li>\n        Built an internal review agent that summarizes PR diffs against\n        the platform contract and flags shared-service ownership conflicts at review time;\n        cross-team review cycle dropped from <strong>3.2 → 0.7 days<\u002Fstrong> median,\n        adopted by 4 sibling platform teams.\n      <\u002Fli>\n      <li>\n        Mentored three senior engineers into staff-track scope; two were promoted within\n        the engagement. Authored the team's career-ladder examples doc, since adopted org-wide.\n      <\u002Fli>\n    <\u002Ful>\n  <\u002Farticle>\n\n  <!-- Role 2 — Senior @ Helix (3y) -->\n  <article class=\"role\">\n    <div class=\"role-header meta-row\">\n      <p class=\"role-title-line\">\n        <span class=\"title\">Senior Software Engineer<\u002Fspan>\n        <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n        <span class=\"company\">Helix Cloud<\u002Fspan>\n      <\u002Fp>\n      <p class=\"role-dates\"><time datetime=\"2019-02\">Feb 2019<\u002Ftime> – <time datetime=\"2022-02\">Feb 2022<\u002Ftime><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"role-meta meta-row\">\n      <p class=\"role-summary\">Edge Compute — tech lead, team of 12; runtime &amp; control plane.<\u002Fp>\n      <p class=\"role-location\">Remote (US)<\u002Fp>\n    <\u002Fdiv>\n    <ul class=\"highlights\">\n      <li>\n        Drove the cold-start program for the V8 isolate runtime: boot time\n        <strong>380&nbsp;ms → 18&nbsp;ms p95<\u002Fstrong> across the fleet. Snapshot\n        creation runs via <code>v8::SnapshotCreator<\u002Fcode>; restore is a\n        single <code>mmap<\u002Fcode> + relocation pass. The design (joint with the\n        runtime team) is now in use across three product lines.\n      <\u002Fli>\n      <li>\n        Designed and shipped the autoscaler rewrite for the regional control plane;\n        replaced the single-leader scheduler with a sharded scheduler keyed by\n        <code>(tenant, region)<\u002Fcode>, lifting the per-region ceiling from 8K to\n        <strong>110K concurrent functions<\u002Fstrong>.\n        <span class=\"scope\"><span class=\"annotation-label\"> — <\u002Fspan>control plane serving ~1.1M tenants<\u002Fspan>\n      <\u002Fli>\n      <li>\n        Wrote the post-incident retrospective for the 2020 us-east-2 control-plane\n        outage; the published findings became the basis for the company-wide\n        “blast radius” review now mandatory for new tier-1 services.\n      <\u002Fli>\n      <li>\n        Established the SLO program for Edge Compute. Defined the availability and\n        latency SLOs the org still operates on, including the error-budget policy that\n        gates feature work.\n      <\u002Fli>\n    <\u002Ful>\n  <\u002Farticle>\n\n  <!-- Role 3 — earlier (2y) -->\n  <article class=\"role\">\n    <div class=\"role-header meta-row\">\n      <p class=\"role-title-line\">\n        <span class=\"title\">Software Engineer<\u002Fspan>\n        <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n        <span class=\"company\">Cardinal Systems<\u002Fspan>\n      <\u002Fp>\n      <p class=\"role-dates\"><time datetime=\"2017-06\">Jun 2017<\u002Ftime> – <time datetime=\"2019-02\">Feb 2019<\u002Ftime><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"role-meta meta-row\">\n      <p class=\"role-summary\">Search &amp; ingestion — IC on a 6-person team.<\u002Fp>\n      <p class=\"role-location\">San Francisco, CA<\u002Fp>\n    <\u002Fdiv>\n    <ul class=\"highlights\">\n      <li>\n        Built the document indexing pipeline (Kafka → custom enrichment service →\n        Elasticsearch) sustaining <strong>50K docs/sec<\u002Fstrong>, ~3× the Logstash-based\n        predecessor at a quarter of the compute footprint. Replay tooling is a\n        single-binary <code>cardinal-replay<\u002Fcode> that re-reads from a\n        committed Kafka offset and shadows the live writer.\n      <\u002Fli>\n      <li>\n        Led the cutover of the auth service from monolith to a standalone Go service\n        handling <strong>22K req/s<\u002Fstrong> at p99 9 ms; zero downtime, traffic-shifted\n        over 72 hours behind a feature flag.\n      <\u002Fli>\n    <\u002Ful>\n  <\u002Farticle>\n\n<\u002Fsection>\n\n<!-- ============= Selected Systems (projects) ============= -->\n<section class=\"section\" aria-labelledby=\"sec-systems\">\n  <div class=\"section-head\">\n    <h2 id=\"sec-systems\">Selected Systems<\u002Fh2>\n    <span class=\"rule\" aria-hidden=\"true\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"projects\">\n    <article class=\"project\">\n      <p>\n        <span class=\"project-name\">Tessera Timeseries Write Path<\u002Fspan>\n        <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n        <span class=\"project-desc\">sharded ingest tier with CRDT-replicated metadata\n        across three regions; custom vectorized executor on the read side.<\u002Fspan>\n      <\u002Fp>\n      <span class=\"project-metrics\">\n        1.4M QPS<span class=\"sep sep-loose\" aria-hidden=\"true\">·<\u002Fspan>p99 38 ms<span class=\"sep sep-loose\" aria-hidden=\"true\">·<\u002Fspan>19 PB<span class=\"sep sep-loose\" aria-hidden=\"true\">·<\u002Fspan>3 regions\n      <\u002Fspan>\n    <\u002Farticle>\n\n    <article class=\"project\">\n      <p>\n        <span class=\"project-name\">Helix Edge V8 Snapshot-Restore<\u002Fspan>\n        <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n        <span class=\"project-desc\">deduplicated heap-snapshot service feeding warm\n        isolates; reduced cold-start blast radius from per-request to per-deploy.<\u002Fspan>\n      <\u002Fp>\n      <span class=\"project-metrics\">\n        cold-start 380 → 18 ms p95<span class=\"sep sep-loose\" aria-hidden=\"true\">·<\u002Fspan>−73% snapshot egress<span class=\"sep sep-loose\" aria-hidden=\"true\">·<\u002Fspan>3 product lines\n      <\u002Fspan>\n    <\u002Farticle>\n\n    <article class=\"project\">\n      <p>\n        <span class=\"project-name\">Cardinal Ingestion Pipeline<\u002Fspan>\n        <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n        <span class=\"project-desc\">Kafka-fed enrichment + ES sink replacing a\n        Logstash topology; back-pressure and replay built into the enrichment\n        protocol.<\u002Fspan>\n      <\u002Fp>\n      <span class=\"project-metrics\">\n        50K docs/sec<span class=\"sep sep-loose\" aria-hidden=\"true\">·<\u002Fspan>−74% ingest cost<span class=\"sep sep-loose\" aria-hidden=\"true\">·<\u002Fspan>p99 enrichment 12 ms\n      <\u002Fspan>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============= Skills ============= -->\n<section class=\"section\" aria-labelledby=\"sec-skills\">\n  <div class=\"section-head\">\n    <h2 id=\"sec-skills\">Skills<\u002Fh2>\n    <span class=\"rule\" aria-hidden=\"true\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <dl class=\"skills\">\n    <dt>Languages<\u002Fdt>\n    <dd>Go<span class=\"sep\">·<\u002Fspan>Rust<span class=\"sep\">·<\u002Fspan>Python<span class=\"sep\">·<\u002Fspan>TypeScript<span class=\"sep\">·<\u002Fspan>SQL<\u002Fdd>\n\n    <dt>Distributed&nbsp;Systems<\u002Fdt>\n    <dd>Raft<span class=\"sep\">·<\u002Fspan>Paxos<span class=\"sep\">·<\u002Fspan>CRDTs<span class=\"sep\">·<\u002Fspan>consistent hashing<span class=\"sep\">·<\u002Fspan>leader election<span class=\"sep\">·<\u002Fspan>gossip<span class=\"sep\">·<\u002Fspan>multi-region failover<span class=\"sep\">·<\u002Fspan>vector clocks<\u002Fdd>\n\n    <dt>Data<\u002Fdt>\n    <dd>Postgres<span class=\"sep\">·<\u002Fspan>ClickHouse<span class=\"sep\">·<\u002Fspan>FoundationDB<span class=\"sep\">·<\u002Fspan>Kafka<span class=\"sep\">·<\u002Fspan>Elasticsearch<span class=\"sep\">·<\u002Fspan>Snowflake<\u002Fdd>\n\n    <dt>Infrastructure<\u002Fdt>\n    <dd>Kubernetes<span class=\"sep\">·<\u002Fspan>Terraform<span class=\"sep\">·<\u002Fspan>AWS (us-east, eu-west, ap-northeast)<span class=\"sep\">·<\u002Fspan>Cloudflare Workers<span class=\"sep\">·<\u002Fspan>gRPC<span class=\"sep\">·<\u002Fspan>Envoy<\u002Fdd>\n\n    <dt>Observability<\u002Fdt>\n    <dd>OpenTelemetry<span class=\"sep\">·<\u002Fspan>Prometheus<span class=\"sep\">·<\u002Fspan>Grafana<span class=\"sep\">·<\u002Fspan>Honeycomb<span class=\"sep\">·<\u002Fspan>structured logging<span class=\"sep\">·<\u002Fspan>SLOs &amp; error budgets<\u002Fdd>\n  <\u002Fdl>\n<\u002Fsection>\n\n<!-- ============= Education ============= -->\n<section class=\"section\" aria-labelledby=\"sec-education\">\n  <div class=\"section-head\">\n    <h2 id=\"sec-education\">Education<\u002Fh2>\n    <span class=\"rule\" aria-hidden=\"true\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"edu-line meta-row\">\n    <p>\n      <span class=\"edu-school\">Carnegie Mellon University<\u002Fspan>\n      <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n      <span class=\"edu-degree\">B.S. Computer Science<\u002Fspan>\n    <\u002Fp>\n    <p class=\"edu-meta\">2017 · Pittsburgh, PA<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
